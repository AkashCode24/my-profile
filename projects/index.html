<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akash Dilshan - Projects</title>
<meta name="title" content="Akash Dilshan - Projects">
<meta name="description" content="Student Developer & Photographer | Explore my photography gallery.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://akashdilshan.site/"> 
<meta property="og:title" content="Akash Dilshan - Gallery">
<meta property="og:description" content="Student Developer & Photographer. Visual stories captured through my lens.">
<meta property="og:image" content="https://images-ext-1.discordapp.net/external/y0hLhY_SLavGRXl9vMw4p0d6uVOVwG0NZTWu6DAWIO0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/886283919304036392/4a3e5eb2562d85771bfa654797c61dba.png?format=webp&quality=lossless">

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://akashdilshan.site/">
<meta property="twitter:title" content="Akash Dilshan - Gallery">
<meta property="twitter:description" content="Student Developer & Photographer. Visual stories captured through my lens.">
<meta property="twitter:image" content="https://images-ext-1.discordapp.net/external/y0hLhY_SLavGRXl9vMw4p0d6uVOVwG0NZTWu6DAWIO0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/886283919304036392/4a3e5eb2562d85771bfa654797c61dba.png?format=webp&quality=lossless">

<meta name="theme-color" content="#000000">

  <link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Product Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none !important;
    }

    @media (hover: hover) and (pointer: fine) {
      * { cursor: none !important; }
      .custom-cursor { display: block !important; }
    }

    body, html {
      height: 100%;
      background-color: #000;
      width: 100%;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Preloader */
    #preloader {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #000;
      display: flex; justify-content: center; align-items: center;
      z-index: 10000;
      transition: opacity 0.8s ease-out, visibility 0.8s;
    }
    .dot { width: 12px; height: 12px; background-color: #fff; border-radius: 50%; animation: blink 1.2s infinite ease-in-out; }
    @keyframes blink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    .loader-hidden { opacity: 0; visibility: hidden; }

    .user-ip {
      position: fixed;
      top: env(safe-area-inset-top, 15px);
      right: 15px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.65rem;
      letter-spacing: 1px;
      z-index: 100;
    }

    .custom-cursor {
      width: 15px; height: 15px;
      background-color: #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 999999; 
      mix-blend-mode: difference; 
      transition: width 0.3s ease, height 0.3s ease, transform 0.1s ease-out;
      transform: translate(-50%, -50%);
      display: none;
    }
    .custom-cursor.hovered { width: 55px; height: 55px; }

    .hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: url('https://cdn.discordapp.com/attachments/1003601745907306528/1488359101644800130/Pngtreedark_green_background_with_abstract_13395331.jpg?ex=69cc7dee&is=69cb2c6e&hm=4fd499368e47e5229b1fe3cc9c55c8b37d884ea6a6fa2de8edb9ab1d7bae431b');
      background-size: cover;
      background-position: center;
    }

    .overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.78); 
      z-index: 2;
    }

    #canvas1 { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 1; 
      pointer-events: none; 
    }

    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Gallery Section - Smaller 3x3 Grid */
    .gallery-section {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .gallery-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery-title h2 {
      color: #fff;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Sliding Text Styles */
    .sliding-text-container {
      height: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .slide-text {
      position: absolute;
      opacity: 0;
      transform: translateY(100%);
      transition: 0.5s ease;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 400;
    }

    .slide-text.active {
      opacity: 1;
      transform: translateY(0);
      position: relative;
    }

    .slide-text.prev {
      opacity: 0;
      transform: translateY(-100%);
    }

    /* 3x3 Grid - Smaller photos */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 650px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 18px;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-color: rgba(255,255,255,0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .item-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 12px 10px 10px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .gallery-item:hover .item-overlay {
      transform: translateY(0);
    }

    .item-overlay span {
      color: #fff;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Back to Home Button */
    .back-home {
      text-align: center;
      margin-top: 35px;
    }

    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 28px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      color: #fff !important;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .back-home-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .back-home-btn i {
      font-size: 0.9rem;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
      cursor: pointer;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }

    .close-lightbox {
      position: absolute;
      top: -40px;
      right: 0;
      font-size: 40px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.7;
      transition: 0.2s;
    }

    .close-lightbox:hover { opacity: 1; transform: scale(1.1); }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 28px;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prev-btn { left: -70px; }
    .next-btn { right: -70px; }

    .nav-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-50%) scale(1.05);
    }

    .counter {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.5);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* Cookie Notice */
    .cookie-container {
      position: fixed;
      bottom: -300px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 340px;
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 22px;
      border-radius: 24px;
      z-index: 2000;
      text-align: center;
      opacity: 0;
      transition: bottom 0.8s ease-in-out, opacity 0.6s ease;
    }

    .cookie-container.show { bottom: 35px; opacity: 1; }
    .cookie-container p { color: #fff; font-size: 0.78rem; margin-bottom: 15px; opacity: 0.9; }
    .cookie-btn {
      padding: 10px 30px;
      background: #fff;
      color: #000 !important;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      border: none;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
    }

    @media (max-width: 768px) {
      .gallery-section { max-width: 95%; }
      .gallery-grid { gap: 10px; max-width: 100%; }
      .gallery-title h2 { font-size: 1.5rem; }
      .slide-text { font-size: 0.7rem; letter-spacing: 1px; }
      .sliding-text-container { height: 1.3rem; }
      .gallery-title { margin-bottom: 20px; }
      .nav-btn { width: 40px; height: 40px; font-size: 22px; }
      .prev-btn { left: -50px; }
      .next-btn { right: -50px; }
      .close-lightbox { top: -35px; font-size: 30px; }
      .counter { bottom: -35px; }
      .back-home { margin-top: 25px; }
      .back-home-btn { padding: 8px 22px; font-size: 0.75rem; }
    }

    @media (max-width: 640px) {
      .gallery-grid { gap: 8px; }
      .content { padding: 15px; }
      .gallery-item { border-radius: 14px; }
      .back-home { margin-top: 20px; }
    }

    @media (min-width: 768px) {
      .cookie-container.show { left: 30px; transform: none; bottom: 30px; }
    }
  </style>
</head>
<body>

  <div id="preloader"><div class="dot"></div></div>
  <div class="user-ip" id="user-ip">IP : FETCHING...</div>
  <div class="custom-cursor" id="cursor"></div>

  <section class="hero">
    <canvas id="canvas1"></canvas>
    <div class="overlay"></div>

    <div class="content">
      <div class="gallery-section">
        <div class="gallery-title">
          <h2>PROJECTS</h2>
          <div class="sliding-text-container" id="textContainer">
            <span class="slide-text active">STUDENT</span>
            <span class="slide-text">DEVELOPER</span>
            <span class="slide-text">PHOTOGRAPHER</span>
          </div>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>

        <!-- Back to Home Button -->
        <div class="back-home">
          <a href="https://akashdilshan.site/" class="back-home-btn">
            <i class="fas fa-arrow-left"></i>
            BACK TO HOME
          </a>
        </div>
      </div>
    </div>
  </section>

  <div id="lightbox" class="lightbox">
    <div class="lightbox-content">
      <button class="close-lightbox">&times;</button>
      <button class="nav-btn prev-btn">‹</button>
      <button class="nav-btn next-btn">›</button>
      <img class="lightbox-img" id="lightboxImg" src="" alt="">
      <div class="counter" id="counter"></div>
    </div>
  </div>

  <div id="cookie-banner" class="cookie-container">
    <p>We use cookies to enhance your experience on our site.</p>
    <button id="accept-cookies" class="cookie-btn">ACCEPT</button>
  </div>

  <script>
    // Disable scroll completely
    window.addEventListener('wheel', function(e) {
      e.preventDefault();
    }, { passive: false });
    
    window.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
    
    // Preloader
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('preloader').classList.add('loader-hidden'), 600);
    });

    // IP Fetch
    async function getIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        document.getElementById('user-ip').innerText = "IP : " + data.ip;
      } catch (e) { document.getElementById('user-ip').innerText = "IP : OFFLINE"; }
    }
    getIP();

    // Disable right click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Custom Cursor
    const cursor = document.getElementById('cursor');
    let cx = 0, cy = 0, curX = 0, curY = 0;
    const isMouse = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (isMouse) {
      document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });
      function anim() {
        curX += (cx - curX) * 0.15;
        curY += (cy - curY) * 0.15;
        cursor.style.left = curX + 'px';
        cursor.style.top = curY + 'px';
        requestAnimationFrame(anim);
      }
      anim();
      document.querySelectorAll('.gallery-item, .nav-btn, .close-lightbox, .cookie-btn, .back-home-btn').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
      });
    }

    // Sliding Text Animation (STUDENT / DEVELOPER / PHOTOGRAPHER)
    const slideTexts = document.querySelectorAll('.slide-text');
    let textIndex = 0;
    
    setInterval(() => {
      slideTexts[textIndex].classList.remove('active');
      slideTexts[textIndex].classList.add('prev');
      const lastIndex = textIndex;
      textIndex = (textIndex + 1) % slideTexts.length;
      slideTexts[textIndex].classList.add('active');
      setTimeout(() => {
        slideTexts[lastIndex].classList.remove('prev');
      }, 500);
    }, 2800);

    // Canvas Particles
    const canvas = document.getElementById('canvas1');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;
        this.r = Math.random() * 1.2 + 0.3;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fill();
      }
    }
    
    function initParticles() {
      resizeCanvas();
      particles = [];
      const count = isMouse ? 80 : 40;
      for (let i = 0; i < count; i++) particles.push(new Particle());
    }
    
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => p.update());
      requestAnimationFrame(animateParticles);
    }
    
    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });
    initParticles();
    animateParticles();

    // Gallery Data - 9 beautiful working images
    const images = [
      { src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500&h=500&fit=crop", title: "Mountain Peak" },
      { src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500&h=500&fit=crop", title: "Forest Trail" },
      { src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500&h=500&fit=crop", title: "Golden Sunset" },
      { src: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500&h=500&fit=crop", title: "Urban Lines" },
      { src: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=500&h=500&fit=crop", title: "Coastal View" },
      { src: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&h=500&fit=crop", title: "Wilderness" },
      { src: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=500&h=500&fit=crop", title: "City Nights" },
      { src: "https://images.unsplash.com/photo-1519751138087-5bf79df62d5b?w=500&h=500&fit=crop", title: "Abstract Flow" },
      { src: "https://images.unsplash.com/photo-1500462918059-b1a0cb512f1d?w=500&h=500&fit=crop", title: "Portrait Mood" }
    ];
    
    // Build 3x3 Gallery Grid
    const galleryGrid = document.getElementById('galleryGrid');
    
    images.forEach((img, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      
      const imageEl = document.createElement('img');
      imageEl.src = img.src;
      imageEl.alt = img.title;
      imageEl.loading = 'eager';
      
      const overlay = document.createElement('div');
      overlay.className = 'item-overlay';
      overlay.innerHTML = `<span>📸 ${img.title}</span>`;
      
      item.appendChild(imageEl);
      item.appendChild(overlay);
      item.addEventListener('click', () => openLightbox(index));
      galleryGrid.appendChild(item);
    });
    
    // Lightbox functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeLightbox = document.querySelector('.close-lightbox');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');
    const counter = document.getElementById('counter');
    let currentIndex = 0;
    
    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add('active');
    }
    
    function updateLightbox() {
      const img = images[currentIndex];
      lightboxImg.src = img.src;
      lightboxImg.alt = img.title;
      counter.textContent = `${currentIndex + 1} / ${images.length}`;
    }
    
    function closeLightboxModal() {
      lightbox.classList.remove('active');
    }
    
    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      updateLightbox();
    }
    
    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateLightbox();
    }
    
    closeLightbox.addEventListener('click', closeLightboxModal);
    prevBtn.addEventListener('click', prevImage);
    nextBtn.addEventListener('click', nextImage);
    
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightboxModal();
    });
    
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightboxModal();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'ArrowRight') nextImage();
    });
    
    // Cookie consent
    const banner = document.getElementById('cookie-banner');
    const acceptBtn = document.getElementById('accept-cookies');
    
    window.addEventListener('load', () => {
      if (!localStorage.getItem('cookiesAccepted')) {
        setTimeout(() => banner.classList.add('show'), 2000);
      }
    });
    
    acceptBtn.addEventListener('click', () => {
      banner.classList.remove('show');
      localStorage.setItem('cookiesAccepted', 'true');
    });
  </script>
</body>
</html>
