<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akash Dilshan - Profile</title>

  <link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Product Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none !important;
    }

    @media (hover: hover) and (pointer: fine) {
      * { cursor: none !important; }
      .custom-cursor { display: block !important; }
    }

    body, html {
      height: 100%;
      background-color: #000;
      width: 100%;
      overflow: hidden;
    }

    /* Preloader */
    #preloader {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #000;
      display: flex; justify-content: center; align-items: center;
      z-index: 10000;
      transition: opacity 0.8s ease-out, visibility 0.8s;
    }
    .dot { width: 12px; height: 12px; background-color: #fff; border-radius: 50%; animation: blink 1.2s infinite ease-in-out; }
    @keyframes blink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    .loader-hidden { opacity: 0; visibility: hidden; }

    .user-ip {
      position: fixed;
      top: env(safe-area-inset-top, 15px);
      right: 15px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.65rem;
      letter-spacing: 1px;
      z-index: 100;
    }

    .custom-cursor {
      width: 15px; height: 15px;
      background-color: #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 999999; 
      mix-blend-mode: difference; 
      transition: width 0.3s ease, height 0.3s ease, transform 0.1s ease-out;
      transform: translate(-50%, -50%);
      display: none;
    }
    .custom-cursor.hovered { width: 55px; height: 55px; }

    .hero {
      position: relative;
      height: 100vh;
      height: 100dvh; 
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: url('https://cdn.discordapp.com/attachments/1003601745907306528/1488359101644800130/Pngtreedark_green_background_with_abstract_13395331.jpg?ex=69cc7dee&is=69cb2c6e&hm=4fd499368e47e5229b1fe3cc9c55c8b37d884ea6a6fa2de8edb9ab1d7bae431b');
      background-size: cover;
      background-position: center;
    }

    .overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.78); 
      z-index: 2;
    }

    #canvas1 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    .content {
      position: relative;
      color: #fff;
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
    }

    .profile-img-container {
      width: 110px; height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 15px;
    }

    .profile-img-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .content h1 { font-size: 2.3rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    .content p {
      margin-top: 5px;
      font-size: 0.9rem;
      letter-spacing: 3px;
      height: 1.4rem;
      display: flex;
      justify-content: center;
      overflow: hidden;
      opacity: 0.8;
    }

    .slide-text { position: absolute; opacity: 0; transform: translateY(100%); transition: 0.5s ease; }
    .slide-text.active { opacity: 1; transform: translateY(0); }
    .slide-text.prev { opacity: 0; transform: translateY(-100%); }

    .btn {
      margin-top: 30px;
      padding: 12px 35px;
      border: 1px solid #fff;
      border-radius: 30px;
      color: #000 !important;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 2px;
      background-color: #fff;
      transition: all 0.4s ease;
      text-transform: uppercase;
      display: inline-block;
    }
    .btn:hover { background-color: transparent; color: #fff !important; transform: scale(1.05); }

    .socials-inline {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .socials-inline a {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff !important;
      font-size: 1.1rem;
      transition: all 0.4s ease;
    }
    .socials-inline a:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-5px); }

    /* --- SMOOTH COOKIE NOTICE (NO BOUNCE) --- */
    .cookie-container {
      position: fixed;
      bottom: -300px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 340px;
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 22px;
      border-radius: 24px;
      z-index: 2000;
      text-align: center;
      opacity: 0;
      /* Smooth standard transition for show/hide */
      transition: bottom 0.8s ease-in-out, opacity 0.6s ease;
    }

    /* එද්දී සහ යද්දී bounce වෙන්නෙ නැතිව smooth විදිහට පේනවා */
    .cookie-container.show { 
      bottom: 35px; 
      opacity: 1;
    }

    .cookie-container p { color: #fff; font-size: 0.78rem; margin-bottom: 15px; opacity: 0.9; line-height: 1.5; }
    .cookie-btn {
      padding: 10px 30px;
      background: #fff;
      color: #000 !important;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      border: none;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
    }
    .cookie-btn:active { transform: scale(0.98); }

    @media (min-width: 768px) {
      .content h1 { font-size: 3.5rem; }
      .cookie-container.show { left: 30px; transform: none; bottom: 30px; }
    }
  </style>
</head>
<body>

  <div id="preloader"><div class="dot"></div></div>
  <div class="user-ip" id="user-ip">IP : FETCHING...</div>
  <div class="custom-cursor" id="cursor"></div>

  <section class="hero">
    <canvas id="canvas1"></canvas>
    <div class="overlay"></div>

    <div class="content">
      <div class="profile-img-container">
        <img src="https://images-ext-1.discordapp.net/external/y0hLhY_SLavGRXl9vMw4p0d6uVOVwG0NZTWu6DAWIO0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/886283919304036392/4a3e5eb2562d85771bfa654797c61dba.png?format=webp&quality=lossless" alt="Akash Dilshan">
      </div>
      
      <h1>Akash Dilshan</h1>
      <p id="text-container">
        <span class="slide-text active">STUDENT</span>
        <span class="slide-text">DEVELOPER</span>
        <span class="slide-text">PHOTOGRAPHER</span>
      </p>

      <a href="https://akashdilshan.site/projects" class="btn" target="_blank">VIEW PROJECTS</a>

      <div class="socials-inline">
        <a href="https://facebook.com/akashdilshan6" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://youtube.com/@Akashdilshan9" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="https://discord.gg/uVrtM7bgYZ" target="_blank"><i class="fab fa-discord"></i></a>
        <a href="https://wa.me/94701399423" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="mailto:x@akashdilshan.site"><i class="fas fa-envelope"></i></a>
      </div>
    </div>
  </section>

  <div id="cookie-banner" class="cookie-container">
    <p>We use cookies to enhance your experience on our site.</p>
    <button id="accept-cookies" class="cookie-btn">ACCEPT</button>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('preloader').classList.add('loader-hidden'), 600);
    });

    async function getIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        document.getElementById('user-ip').innerText = "IP : " + data.ip;
      } catch (e) { document.getElementById('user-ip').innerText = "IP : OFFLINE"; }
    }
    getIP();

    document.addEventListener('contextmenu', e => e.preventDefault());

    // Cursor
    const cursor = document.getElementById('cursor');
    let cx = 0, cy = 0, curX = 0, curY = 0;
    const isMouse = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (isMouse) {
      document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });
      function anim() {
        curX += (cx - curX) * 0.15; curY += (cy - curY) * 0.15;
        cursor.style.left = curX + 'px'; cursor.style.top = curY + 'px';
        requestAnimationFrame(anim);
      }
      anim();
      document.querySelectorAll('a, button, .profile-img-container').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
      });
    }

    // Slider
    const texts = document.querySelectorAll('.slide-text');
    let idx = 0;
    setInterval(() => {
      texts[idx].classList.remove('active');
      texts[idx].classList.add('prev');
      const last = idx;
      idx = (idx + 1) % texts.length;
      texts[idx].classList.add('active');
      setTimeout(() => texts[last].classList.remove('prev'), 500);
    }, 3000);

    // Canvas
    const canvas = document.getElementById('canvas1');
    const ctx = canvas.getContext('2d');
    let parts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    class Part {
      constructor() {
        this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.2; this.vy = (Math.random() - 0.5) * 0.2;
        this.r = Math.random() * 1.2 + 0.3;
      }
      up() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fill();
      }
    }
    function init() { resize(); parts = []; for(let i=0; i<(isMouse?80:40); i++) parts.push(new Part()); }
    function loop() { ctx.clearRect(0,0,canvas.width,canvas.height); parts.forEach(p => p.up()); requestAnimationFrame(loop); }
    init(); loop();
    window.addEventListener('resize', init);

    // Cookie logic
    const banner = document.getElementById('cookie-banner');
    const btn = document.getElementById('accept-cookies');
    window.addEventListener('load', () => {
      if (!localStorage.getItem('cookiesAccepted')) {
        setTimeout(() => banner.classList.add('show'), 2000);
      }
    });
    btn.addEventListener('click', () => {
      banner.classList.remove('show');
      localStorage.setItem('cookiesAccepted', 'true');
    });
  </script>
</body>
</html>
