<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash Dilshan - Profile</title>

  <link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Product Sans', sans-serif;
      cursor: none !important;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    /* Preloader Styling */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 1s ease-out, visibility 1s;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: #fff;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .loader-hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* IP Display */
    .user-ip {
      position: fixed;
      top: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.65rem;
      letter-spacing: 1px;
      z-index: 100;
    }

    /* Custom Cursor */
    .custom-cursor {
      width: 15px;
      height: 15px;
      background-color: #fff;
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference; 
      transition: width 0.3s ease, height 0.3s ease, transform 0.1s ease-out;
      transform: translate(-50%, -50%);
    }

    .custom-cursor.hovered {
      width: 60px;
      height: 60px;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: url('https://cdn.discordapp.com/attachments/1003601745907306528/1488359101644800130/Pngtreedark_green_background_with_abstract_13395331.jpg?ex=69cc7dee&is=69cb2c6e&hm=4fd499368e47e5229b1fe3cc9c55c8b37d884ea6a6fa2de8edb9ab1d7bae431b');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #canvas1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; 
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75); 
      z-index: 0;
    }

    .content {
      position: relative;
      color: #fff;
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 2s ease-in-out;
    }

    /* Profile Image Styling */
    .profile-img-container {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 5px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
      cursor: none; /* JS interaction එක නිසා මෙතනට 'pointer' අවශ්‍ය නැත, cursor handle කරන්නේ JS වලින් */
    }

    /* Image hover effects */
    .profile-img-container:hover {
      transform: scale(1.05) translateY(-5px);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .content h1 {
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
    }

    .content p {
      margin-top: 5px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      height: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .slide-text {
      opacity: 0;
      position: absolute;
      transform: translateY(100%);
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    .slide-text.active { opacity: 0.7; transform: translateY(0); }
    .slide-text.prev { opacity: 0; transform: translateY(-100%); }

    /* Button Styled Link */
    .btn {
      margin-top: 25px;
      padding: 12px 35px;
      border: 1px solid #fff;
      border-radius: 30px;
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 2px;
      background-color: #fff;
      transition: all 0.4s ease;
      position: relative;
      z-index: 11;
      text-transform: uppercase;
      text-decoration: none; 
      display: inline-block;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      backdrop-filter: blur(10px);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .socials {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    .socials a {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: 0.4s ease;
      text-decoration: none;
      opacity: 0;
      animation: socialFade 0.8s forwards;
    }

    .socials a:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.2); border-color: #fff; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes socialFade { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div id="preloader">
    <div class="dot"></div>
  </div>

  <div class="user-ip" id="user-ip">FETCHING IP...</div>
  <div class="custom-cursor" id="cursor"></div>

  <section class="hero">
    <canvas id="canvas1"></canvas>
    <div class="overlay"></div>

    <div class="content">
      <div class="profile-img-container" id="profile-img">
        <img src="https://images-ext-1.discordapp.net/external/y0hLhY_SLavGRXl9vMw4p0d6uVOVwG0NZTWu6DAWIO0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/886283919304036392/4a3e5eb2562d85771bfa654797c61dba.png?format=webp&quality=lossless" alt="Akash Dilshan">
      </div>
      
      <h1>Akash Dilshan</h1>
      <p id="text-container">
        <span class="slide-text active">STUDENT</span>
        <span class="slide-text">DEVELOPER</span>
        <span class="slide-text">PHOTOGRAPHER</span>
      </p>
      <a href="https://akashdilshan.site/projects" class="btn" target="_blank">VIEW PROJECTS</a>
    </div>

    <div class="socials">
      <a href="https://facebook.com/akashdilshan6"><i class="fab fa-facebook-f"></i></a>
      <a href="https://youtube.com/@Akashdilshan9"><i class="fab fa-youtube"></i></a>
      <a href="https://discord.gg/uVrtM7bgYZ"><i class="fab fa-discord"></i></a>
      <a href="https://wa.me/94701399423"><i class="fab fa-whatsapp"></i></a>
      <a href="mailto:x@akashdilshan.site"><i class="fas fa-envelope"></i></a>
    </div>
  </section>

  <script>
    // Preloader Logic
    window.addEventListener('load', () => {
      const loader = document.getElementById('preloader');
      setTimeout(() => {
        loader.classList.add('loader-hidden');
      }, 1000);
    });

    // IP Fetching
    async function getIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        document.getElementById('user-ip').innerText = "IP: " + data.ip;
      } catch (e) { document.getElementById('user-ip').innerText = ""; }
    }
    getIP();

    document.addEventListener('contextmenu', e => e.preventDefault());

    // Cursor Logic
    const cursor = document.getElementById('cursor');
    let cursorX = 0, cursorY = 0, currentX = 0, currentY = 0;
    document.addEventListener('mousemove', e => { cursorX = e.clientX; cursorY = e.clientY; });

    function animateCursor() {
      currentX += (cursorX - currentX) * 0.15;
      currentY += (cursorY - currentY) * 0.15;
      cursor.style.left = currentX + 'px';
      cursor.style.top = currentY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Cursor Hover Interactions - Adding profile image to the list
    const hoverables = document.querySelectorAll('a, button, .profile-img-container');
    
    hoverables.forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
    });

    // Slide Up Text
    const textSpans = document.querySelectorAll('.slide-text');
    let currentIndex = 0;
    function changeText() {
      if(textSpans.length === 0) return;
      textSpans[currentIndex].classList.remove('active');
      textSpans[currentIndex].classList.add('prev');
      const prevIndex = currentIndex;
      currentIndex = (currentIndex + 1) % textSpans.length;
      textSpans[currentIndex].classList.add('active');
      setTimeout(() => { textSpans[prevIndex].classList.remove('prev'); }, 500); 
    }
    setInterval(changeText, 3000);

    // Canvas
    const canvas = document.getElementById('canvas1');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = [];
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.dx = (Math.random() - 0.5) * 0.5;
        this.dy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 1.5;
      }
      update() {
        if (this.x > canvas.width || this.x < 0) this.dx = -this.dx;
        if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;
        this.x += this.dx; this.y += this.dy;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();
      }
    }
    function init() {
      particles = [];
      for (let i = 0; i < 80; i++) particles.push(new Particle());
    }
    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => p.update());
    }
    init(); animate();
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; init(); });
  </script>
</body>
</html>
