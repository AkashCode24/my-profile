<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash Dilshan - Profile</title>

  <link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Product Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    @media (hover: hover) and (pointer: fine) {
      * { cursor: none !important; }
      .custom-cursor { display: block !important; }
    }

    body, html {
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 1s ease-out, visibility 1s;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: #fff;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .loader-hidden { opacity: 0; visibility: hidden; }

    .user-ip {
      position: fixed;
      top: 15px;
      right: 15px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.6rem;
      letter-spacing: 1px;
      z-index: 100;
    }

    .custom-cursor {
      width: 15px;
      height: 15px;
      background-color: #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference; 
      transition: width 0.3s ease, height 0.3s ease, transform 0.1s ease-out;
      transform: translate(-50%, -50%);
      display: none;
    }

    .custom-cursor.hovered { width: 60px; height: 60px; }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: url('https://cdn.discordapp.com/attachments/1003601745907306528/1488359101644800130/Pngtreedark_green_background_with_abstract_13395331.jpg?ex=69cc7dee&is=69cb2c6e&hm=4fd499368e47e5229b1fe3cc9c55c8b37d884ea6a6fa2de8edb9ab1d7bae431b');
      background-size: cover;
      background-position: center;
    }

    #canvas1 {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none; 
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); 
      z-index: 0;
    }

    .content {
      position: relative;
      color: #fff;
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      width: 100%;
    }

    .profile-img-container {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 5px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 15px;
      transition: transform 0.5s ease;
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .content h1 {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .content p {
      margin-top: 10px;
      font-size: 1rem;
      letter-spacing: 2px;
      height: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .slide-text {
      opacity: 0;
      position: absolute;
      transform: translateY(100%);
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    .slide-text.active { opacity: 0.7; transform: translateY(0); }
    .slide-text.prev { opacity: 0; transform: translateY(-100%); }

    .btn {
      margin-top: 30px;
      padding: 12px 35px;
      border: 1px solid #fff;
      border-radius: 30px;
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 2px;
      background-color: #fff;
      transition: all 0.4s ease;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
      position: relative;
      z-index: 11;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      backdrop-filter: blur(10px);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .socials {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .socials a {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: 0.4s ease;
      text-decoration: none;
    }

    .socials a:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
      border-color: #fff;
    }

    @media (min-width: 768px) {
      .content h1 { font-size: 3.5rem; }
      .profile-img-container { width: 130px; height: 130px; }
      .socials { bottom: 40px; gap: 15px; }
      .socials a { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>

  <div id="preloader">
    <div class="dot"></div>
  </div>

  <div class="user-ip" id="user-ip">FETCHING IP...</div>
  <div class="custom-cursor" id="cursor"></div>

  <section class="hero">
    <canvas id="canvas1"></canvas>
    <div class="overlay"></div>

    <div class="content">
      <div class="profile-img-container" id="profile-img">
        <img src="https://images-ext-1.discordapp.net/external/y0hLhY_SLavGRXl9vMw4p0d6uVOVwG0NZTWu6DAWIO0/%3Fsize%3D512/https/cdn.discordapp.com/avatars/886283919304036392/4a3e5eb2562d85771bfa654797c61dba.png?format=webp&quality=lossless" alt="Akash Dilshan">
      </div>
      
      <h1>Akash Dilshan</h1>
      <p id="text-container">
        <span class="slide-text active">STUDENT</span>
        <span class="slide-text">DEVELOPER</span>
        <span class="slide-text">PHOTOGRAPHER</span>
      </p>
      <a href="https://akashdilshan.site/projects" class="btn" target="_blank">VIEW PROJECTS</a>
    </div>

    <div class="socials">
      <a href="https://facebook.com/akashdilshan6"><i class="fab fa-facebook-f"></i></a>
      <a href="https://youtube.com/@Akashdilshan9"><i class="fab fa-youtube"></i></a>
      <a href="https://discord.gg/uVrtM7bgYZ"><i class="fab fa-discord"></i></a>
      <a href="https://wa.me/94701399423"><i class="fab fa-whatsapp"></i></a>
      <a href="mailto:x@akashdilshan.site"><i class="fas fa-envelope"></i></a>
    </div>
  </section>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('preloader');
      setTimeout(() => { loader.classList.add('loader-hidden'); }, 1000);
    });

    async function getIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        document.getElementById('user-ip').innerText = "IP: " + data.ip;
      } catch (e) { document.getElementById('user-ip').innerText = ""; }
    }
    getIP();

    document.addEventListener('contextmenu', e => e.preventDefault());

    const cursor = document.getElementById('cursor');
    let cursorX = 0, cursorY = 0, currentX = 0, currentY = 0;
    const isMouse = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    if (isMouse) {
      document.addEventListener('mousemove', e => { 
        cursorX = e.clientX; 
        cursorY = e.clientY; 
      });

      function animateCursor() {
        currentX += (cursorX - currentX) * 0.15;
        currentY += (cursorY - currentY) * 0.15;
        cursor.style.left = currentX + 'px';
        cursor.style.top = currentY + 'px';
        requestAnimationFrame(animateCursor);
      }
      animateCursor();

      document.querySelectorAll('a, button, .profile-img-container').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
      });
    }

    const textSpans = document.querySelectorAll('.slide-text');
    let currentIndex = 0;
    function changeText() {
      if(textSpans.length === 0) return;
      textSpans[currentIndex].classList.remove('active');
      textSpans[currentIndex].classList.add('prev');
      const prevIndex = currentIndex;
      currentIndex = (currentIndex + 1) % textSpans.length;
      textSpans[currentIndex].classList.add('active');
      setTimeout(() => { textSpans[prevIndex].classList.remove('prev'); }, 500); 
    }
    setInterval(changeText, 3000);

    // ==========================================
    // CANVAS PARTICLES (ස්වාධීන තිත් පමණක්)
    // ==========================================
    const canvas = document.getElementById('canvas1');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();

    let particlesArray = [];
    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    const numberOfParticles = isMobile ? 60 : 150; 

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * (isMobile ? 0.4 : 0.8); 
        this.vy = (Math.random() - 0.5) * (isMobile ? 0.4 : 0.8);
        this.radius = Math.random() * 2 + 0.5; 
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; 
        ctx.fill();
      }

      update() {
        if (this.x > canvas.width || this.x < 0) this.vx = -this.vx;
        if (this.y > canvas.height || this.y < 0) this.vy = -this.vy;

        this.x += this.vx;
        this.y += this.vy;
      }
    }

    function initCanvas() {
      resizeCanvas();
      particlesArray = [];
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); 

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles); 
    }

    initCanvas();
    animateParticles();

    window.addEventListener('resize', () => {
      initCanvas();
    });
  </script>
</body>
</html>
